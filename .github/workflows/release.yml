name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  macos:
    needs: version
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    env:
      VAANI_VERSION: ${{ needs.version.outputs.version }}
      VAANI_VERSION_CODE: ${{ needs.version.outputs.code }}
      VAANI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'arm64'
        run: swift test --package-path macos
      - run: ./scripts/build-macos.sh
      - name: Package app
        run: |
          codesign --verify --deep --strict build/Vaani.app
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent build/Vaani.app "out/Vaani-${VAANI_VERSION}-macOS-${VAANI_ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error
  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VAANI_VERSION: ${{ needs.version.outputs.version }}
      VAANI_VERSION_CODE: ${{ needs.version.outputs.code }}
      VAANI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VAANI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      VAANI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          for name in ['KEYSTORE_BASE64', 'VAANI_ANDROID_KEYSTORE_PASSWORD', 'VAANI_ANDROID_KEY_ALIAS', 'VAANI_ANDROID_KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing secret: {name}')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vaani-release.p12'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VAANI_ANDROID_KEYSTORE={path}\n')
          PY
      - name: Check and build signed APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify and package APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Vaani-${VAANI_VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vaani-release.p12"
  draft:
    needs: [version, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums and draft release
        run: |
          cd out
          sha256sum *.zip *.apk > SHA256SUMS
          cat > /tmp/vaani-release-notes.md <<'NOTES'
          Early personal-use pre-release.

          - macOS: choose arm64 for Apple silicon or x86_64 for Intel. Unzip and move Vaani.app to Applications. These builds are ad-hoc signed, not Apple-notarized; macOS may require approval. Recheck microphone and Accessibility permissions after updating.
          - Android: install the release APK. Updates between release APKs retain settings. Existing debug builds use a different signing key: export shared settings first, uninstall the debug app, install this APK and re-enter device-local API keys. Dictionary and other shared settings can be imported afterward.
          - SHA256SUMS verifies downloaded assets. API keys, recordings and personal settings are not included.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/vaani-existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/vaani-existing-release.json"))["isDraft"], "Published releases are immutable; use a new version tag"'
            gh release upload "$RELEASE_TAG" ./*.zip ./*.apk SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip ./*.apk SHA256SUMS --verify-tag --draft --prerelease --title "Vaani $RELEASE_TAG" --generate-notes --notes-file /tmp/vaani-release-notes.md
          fi
